<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>ExpresoFast - Envíos Paginados</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <header class="topbar">
        <span class="brand">ExpresoFast · Envíos Paginados</span>
        <nav>
            <a href="dashboard.html">Volver al panel</a>
            <button onclick="cerrarSesion()">Cerrar sesión</button>
        </nav>
    </header>

    <main>
        <section>
            <h2>Consulta de Envíos</h2>

            <form id="form-filtros">
                <label>
                    Buscar dirección:
                    <input type="text" id="input-busqueda" placeholder="Ej: San Jose" />
                </label>

                <label>
                    Estado:
                    <select id="select-estado">
                        <option value="">-- Todos --</option>
                        <option value="PENDIENTE">PENDIENTE</option>
                        <option value="EN_TRANSITO">EN_TRANSITO</option>
                        <option value="ENTREGADO">ENTREGADO</option>
                        <option value="CANCELADO">CANCELADO</option>
                    </select>
                </label>

                <label>
                    Ítems por página:
                    <select id="select-tamano">
                        <option value="5">5</option>
                        <option value="10">10</option>
                        <option value="20">20</option>
                    </select>
                </label>

                <button type="submit">Filtrar</button>
                <button type="button" id="btn-sp">Consultar vía Stored Procedure</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>Rastreo</th>
                        <th>Dirección</th>
                        <th>Flete</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tbody-envios"></tbody>
            </table>

            <nav id="paginador">
                <button id="btn-primera">&laquo; Primera</button>
                <button id="btn-anterior">&lsaquo; Anterior</button>
                <span id="texto-pagina">Página 1 de 1 (Total: 0 envíos)</span>
                <button id="btn-siguiente">Siguiente &rsaquo;</button>
                <button id="btn-ultima">Última &raquo;</button>
            </nav>
        </section>
    </main>

    <script src="auth.js"></script>
    <script src="paginado.js"></script>
</body>

</html>
